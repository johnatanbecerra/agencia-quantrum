<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANTRUM | Agencia Digital de Élite</title>
    
    <link rel="icon" type="image/png" href="quantrum_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* CSS CORREGIDO PARA MÓVILES */
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, #020617 0%, #000000 50%, #082f49 100%);
            background-attachment: fixed;
            color: #fff; 
            margin: 0; 
            overflow-x: hidden; /* Esto evita que la página se desborde horizontalmente */
            width: 100%;
        }
        
        /* Contenedor de botones flotantes (PWA + Chat + WA) */
        .floating-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-end;
        }

        .float-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .float-btn:hover { transform: scale(1.1); }
        
        #btn-wa { background: #25d366; }
        #btn-chat { background: #3b82f6; }
        #btn-pwa { background: #8b5cf6; } /* Botón PWA */
        
        /* Ajustes de responsive */
        @media (max-width: 768px) {
            .float-btn { width: 48px; height: 48px; }
            h1 { font-size: 2.5rem !important; }
        }
    </style>
</head>
<body>

    <div class="floating-container">
        <button id="btn-pwa" class="float-btn" onclick="alert('Instalando Quantrum App...')">
            <i data-lucide="download" class="text-white w-6 h-6"></i>
        </button>
        <button id="chat-toggle-btn" class="float-btn" id="btn-chat">
            <i data-lucide="message-circle" class="text-white w-6 h-6"></i>
        </button>
        <a href="https://wa.me/584129550884" target="_blank" class="float-btn" id="btn-wa">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA" class="w-7 h-7">
        </a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => { 
            lucide.createIcons(); 
            // ... (Toda tu lógica de Chatbot y Formulario aquí)
        });
    </script>
</body>
</html>
